<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17171c">
  <title>SubFeed</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 id="page-title">알림</h1>
      <button id="refresh-btn" class="icon-btn" aria-label="새로고침">↻</button>
    </header>
    <main id="view" class="view"></main>
    <nav class="bottom-nav" aria-label="앱 메뉴">
      <button class="nav-btn active" data-tab="feed"><span>◉</span><small>알림</small></button>
      <button class="nav-btn" data-tab="channels"><span>♧</span><small>채널</small></button>
      <button class="nav-btn" data-tab="account"><span>♙</span><small>계정</small></button>
      <button class="nav-btn" data-tab="settings"><span>⚙</span><small>설정</small></button>
    </nav>
  </div>
  <div id="toast" role="status"></div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
